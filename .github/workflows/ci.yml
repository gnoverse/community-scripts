name: Community Tests

on:
  push:
    branches: [main, init-community-scripts]
  pull_request:
    branches: [main]

# Optional repository variable:
#   vars.FUNDER_MNEMONIC — mnemonic of the test1 faucet account.
#   Defaults to the public test1 mnemonic if not set.
#
# The funder script runs inside a gnokey Docker container — no local
# gnokey installation required on the runner.

jobs:
  tests-one-shot:
    name: One-shot — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remotes: https://rpc.test-13-aeddi-1.gnoland.network,https://rpc.test-13-gfanton-1.gnoland.network,https://rpc.test-13-moul-1.gnoland.network
            chainid: test-13

    steps:
      - uses: actions/checkout@v4

      - name: Run one-shot tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-one-shot \
            REMOTES=${{ matrix.network.remotes }} \
            CHAINID=${{ matrix.network.chainid }}

  tests-repeatable:
    name: Repeatable — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remotes: https://rpc.test-13-aeddi-1.gnoland.network
            chainid: test-13

    steps:
      - uses: actions/checkout@v4

      - name: Run repeatable tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-repeatable \
            REMOTES=${{ matrix.network.remotes }} \
            CHAINID=${{ matrix.network.chainid }}

name: Community Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Optional repository variable:
#   vars.FUNDER_MNEMONIC — mnemonic of the funder account (test1)
#   Defaults to the public test1 mnemonic if not set.
#   Each test run generates a fresh throwaway account funded by test1.
#   No per-contributor secret is needed.

jobs:
  tests-one-shot:
    name: One-shot — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remote: https://rpc.test.gno.land:443
            chainid: test-13
            funder: ./funders/test-13.sh

    steps:
      - uses: actions/checkout@v4

      - name: Run one-shot tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-one-shot \
            REMOTE=${{ matrix.network.remote }} \
            CHAINID=${{ matrix.network.chainid }} \
            FUNDER=${{ matrix.network.funder }}

  tests-repeatable:
    name: Repeatable — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remote: https://rpc.test.gno.land:443
            chainid: test-13
            funder: ./funders/test-13.sh

    steps:
      - uses: actions/checkout@v4

      - name: Run repeatable tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-repeatable \
            REMOTE=${{ matrix.network.remote }} \
            CHAINID=${{ matrix.network.chainid }} \
            FUNDER=${{ matrix.network.funder }}

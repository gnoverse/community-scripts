name: Community Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Optional repository variable:
#   vars.FUNDER_MNEMONIC — mnemonic of the test1 faucet account.
#   Defaults to the public test1 mnemonic if not set.
#
# No per-contributor secret is needed. Each test run generates a fresh
# throwaway wallet, funds it from test1, and discards it after the run.

jobs:
  tests-one-shot:
    name: One-shot — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remote: https://rpc.test-13-aeddi-1.gnoland.network
            chainid: test-13

    steps:
      - uses: actions/checkout@v4

      - name: Run one-shot tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-one-shot \
            REMOTE=${{ matrix.network.remote }} \
            CHAINID=${{ matrix.network.chainid }}

  tests-repeatable:
    name: Repeatable — ${{ matrix.network.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: test-13
            remote: https://rpc.test-13-aeddi-1.gnoland.network
            chainid: test-13

    steps:
      - uses: actions/checkout@v4

      - name: Run repeatable tests
        env:
          FUNDER_MNEMONIC: ${{ vars.FUNDER_MNEMONIC }}
        run: |
          make tests-repeatable \
            REMOTE=${{ matrix.network.remote }} \
            CHAINID=${{ matrix.network.chainid }}
